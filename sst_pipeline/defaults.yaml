# =============================================================================
# SSAH SST Optical Pipeline — default configuration (v2.0.0)
# =============================================================================
# Do not edit this file to configure a site. Copy config/site_template.yaml,
# fill it in, and pass it with --config: it is deep-merged over these
# defaults, so it only needs the keys you change.
# =============================================================================

# ---------------------------------------------------------------------------
# Instrument / CCD   [PLACEHOLDER] values from the actual camera datasheet
# ---------------------------------------------------------------------------
instrument:
  name: "SSAH-CCD-01"
  gain_e_per_adu: 1.47
  read_noise_e: 9.3
  saturation_adu: 65535        # use the NON-LINEARITY limit, not the ADC max
  pixel_scale_arcsec: 0.82     # 206265 * pixel_size_mm / focal_length_mm
  pixel_size_um: 9.0
  focal_length_mm: 2268.0
  aperture_mm: 356.0
  detector_nx: 4096
  detector_ny: 4096

# ---------------------------------------------------------------------------
# Site   [PLACEHOLDER] surveyed coordinates; MPC code if one is assigned
# ---------------------------------------------------------------------------
site:
  name: "Sharjah Astronomical Observatory"
  iau_obs_code: "XXX"
  latitude_deg: 25.3573
  longitude_deg: 55.4033
  height_m: 50.0

# ---------------------------------------------------------------------------
# Observing mode
#   sidereal : telescope tracks stars  -> stars are points, RSOs trail
#   rate     : telescope tracks target -> target is a point, stars trail
# ---------------------------------------------------------------------------
observation:
  tracking_mode: "sidereal"
  science_image_types: ["LIGHT", "LIGHT FRAME", "OBJECT", "SCIENCE", ""]
  ra_numeric_unit: "deg"       # unit of a NUMERIC RA keyword: "deg" or "hour"
                               # (sexagesimal strings are always read as hours)

# ---------------------------------------------------------------------------
# Timing   [PLACEHOLDER] calibrate time_bias_ms, e.g. by observing GNSS
#          satellites with precise ephemerides and fitting the along-track O-C
# ---------------------------------------------------------------------------
timing_calibration:
  date_obs_reference: "start"  # what DATE-OBS marks: start | mid | end
  time_bias_ms: 0.0            # + if the shutter opens LATER than the stamp
  shutter_type: "global"       # global | rolling
  readout_time_ms: 0.0         # rolling shutter only: first->last row
  rolling_direction: "increasing_y"   # increasing_y | decreasing_y

# ---------------------------------------------------------------------------
# FITS header validation
#   required: true  -> frame fails BOTH QC tracks if missing/invalid
#   type: float | string | datetime | angle_ra | angle_dec
# ---------------------------------------------------------------------------
header_requirements:
  - {keyword: DATE-OBS, required: true,  type: datetime}
  - {keyword: EXPTIME,  required: true,  type: float, min: 0.0001, max: 600.0, aliases: [EXPOSURE]}
  - {keyword: OBJECT,   required: true,  type: string, aliases: [TARGET]}
  - {keyword: TELESCOP, required: true,  type: string, aliases: [TELESCOPE]}
  - {keyword: INSTRUME, required: true,  type: string, aliases: [INSTRUMENT, CAMERA]}
  - {keyword: RA,       required: false, type: angle_ra,  aliases: [OBJCTRA, RA_OBJ]}
  - {keyword: DEC,      required: false, type: angle_dec, aliases: [OBJCTDEC, DEC_OBJ]}
  - {keyword: AIRMASS,  required: false, type: float, min: 1.0, max: 40.0}
  - {keyword: FILTER,   required: false, type: string, aliases: [FLTNAME]}
  - {keyword: CCD-TEMP, required: false, type: float, min: -120.0, max: 40.0, aliases: [CCDTEMP, TEMPERAT]}
  - {keyword: IMAGETYP, required: false, type: string, aliases: [IMGTYPE, FRAMETYP]}
  - {keyword: OBSERVER, required: false, type: string}

# ---------------------------------------------------------------------------
# Calibration
#   master_dark must be bias-subtracted and normalised to 1 s.
#   master_flat must be normalised (median ~ 1) and taken in the same filter.
# ---------------------------------------------------------------------------
calibration:
  master_bias_path: ""         # [PLACEHOLDER]
  master_dark_path: ""         # [PLACEHOLDER]
  master_flat_path: ""         # [PLACEHOLDER]
  cosmic_ray_rejection: true   # needs astroscrappy; skipped (not faked) if absent
  lacosmic_sigclip: 4.5
  lacosmic_sigfrac: 0.3
  lacosmic_objlim: 5.0
  lacosmic_niter: 4

# ---------------------------------------------------------------------------
# Source extraction (SEP)
# ---------------------------------------------------------------------------
source_extraction:
  detection_sigma: 3.0
  min_pixels: 5
  deblend_nthresh: 32
  deblend_cont: 0.005
  background_mesh_px: 64
  merge_streak_fragments: true
  fragment_max_angle_deg: 5.0
  fragment_max_offset_px: 3.0
  fragment_max_gap_px: 30.0

# ---------------------------------------------------------------------------
# Morphological classification
# ---------------------------------------------------------------------------
source_classification:
  elongation_threshold: 2.5    # a/b above this -> trailed
  min_streak_length_px: 8.0    # true trail length (PSF removed)
  min_fwhm_px: 1.2             # narrower -> hot pixel / cosmic ray
  max_point_fwhm_px: 15.0
  bleed_axis_tolerance_deg: 1.0   # saturated trail along a CCD axis = bleed, not RSO

# ---------------------------------------------------------------------------
# Quality control — dual track (photometry strict, astrometry lenient)
# ---------------------------------------------------------------------------
qc:
  snr:              {photometry_min: 10.0, astrometry_min: 5.0}
  saturation:       {photometry_max_fraction: 0.0005, astrometry_max_fraction: 0.02}
  background:       {stability_sigma_max: 4.0, window_frames: 10, min_frames: 5}
  seeing:           {photometry_max_fwhm_arcsec: 6.0, astrometry_max_fwhm_arcsec: 10.0}
  tracking:         {max_star_ellipticity: 0.35}     # sidereal mode only
  transparency:     {min_star_fraction: 0.5}         # vs. sequence median
  rms_thresholds:   {astrometric_rms_max_arcsec: 1.5, photometric_rms_max_mag: 0.10}
  require_verified_wcs: true   # positions only from catalogue-verified plates
  artifacts:
    max_cosmic_ray_fraction: 0.002
    severe_cosmic_ray_fraction: 0.01
    hot_pixel_adu_threshold: 60000
    max_hot_pixel_fraction: 0.0001
    max_bad_column_fraction: 0.01
    max_background_gradient_fraction: 0.25
  trail_tolerance: {max_trail_length_px: 2000}       # photometry track only

# ---------------------------------------------------------------------------
# Astrometry / WCS
# ---------------------------------------------------------------------------
astrometry:
  use_header_wcs: true
  solve_field_timeout_s: 120   # used only with --solve-wcs
  solve_field_search_radius_deg: 2.0
  solve_field_scale_tolerance: 0.1
  # Reference catalogue (Gaia DR3), in priority order:
  #  1. reference_catalog_path: one small CSV (ra,dec,mag[,pmra,pmdec,ref_epoch])
  #  2. reference_catalog_dir : tiled local store, built in advance with
  #     the sst-refcat tool. With --catalog, cells missing for
  #     a field are downloaded once (sources below, in order) and kept.
  reference_catalog_path: ""
  reference_catalog_dir: "data/refcat"
  catalog_mag_limit: 16.0      # used when a new store is created
  online_sources: ["vizier", "esa"]
  vizier_servers: ["vizier.cds.unistra.fr", "vizier.cfa.harvard.edu"]
  online_timeout_s: 60
  initial_offset_search_arcsec: 120.0
  match_radius_arcsec: 2.0
  min_match_stars: 8
  sip_degree: 2                # 0 = linear TAN; >=2 needs >= 15 stars
  min_stars_for_sip: 15

# ---------------------------------------------------------------------------
# Photometry
# ---------------------------------------------------------------------------
photometry:
  aperture_radius_fwhm: 1.5    # aperture radius = this x median FWHM
  annulus_inner_fwhm: 4.0
  annulus_outer_fwhm: 7.0
  min_aperture_radius_px: 2.0
  trail_halfwidth_fwhm: 1.5
  trail_end_padding_fwhm: 1.5
  min_zp_stars: 5
  zp_star_min_snr: 20.0
  fallback_zeropoint_mag: 25.0 # [PLACEHOLDER] mag for 1 ADU/s above atmosphere
  extinction_coeff: 0.15       # [PLACEHOLDER] mag/airmass, fallback ZP only

# ---------------------------------------------------------------------------
# Tracklet linking (multi-frame) and UCT detection
# ---------------------------------------------------------------------------
tracklet:
  static_match_radius_arcsec: 3.0
  static_min_frames: 3
  min_rate_arcsec_per_sec: 0.2
  max_rate_arcsec_per_sec: 4000.0
  max_frame_gap_sec: 120.0
  link_tolerance_arcsec: 6.0
  min_positions: 3
  max_residual_arcsec: 3.0
  streak_pa_tolerance_deg: 10.0
  streak_rate_tolerance: 0.3   # fractional
  report_single_frame_streaks: true

# ---------------------------------------------------------------------------
# Known-object identification (TLE / SGP4)
#   TLE errors are mostly ALONG-track (Flohrer et al. 2008), so the
#   along-track window is wider than the cross-track one.
# ---------------------------------------------------------------------------
tle_tracking:
  enabled: true
  tle_file_path: ""            # download with the sst-tle tool
  max_tle_age_days: 14.0
  cross_track_tolerance_arcsec: 180.0
  along_track_tolerance_arcsec: 900.0
  rate_tolerance: 0.3          # fractional
  pa_tolerance_deg: 15.0
  min_altitude_deg: 0.0

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  report_unverified_astrometry: false
  ades_contact_name: "[PLACEHOLDER]"
  generate_plots: true
  save_calibrated_frames: false
